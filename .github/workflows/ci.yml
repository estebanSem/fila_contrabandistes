name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
      - run: supabase status -o env > "$RUNNER_TEMP/fila-local.env"
      - run: node --env-file="$RUNNER_TEMP/fila-local.env" node_modules/@playwright/test/cli.js test
      - if: always()
        run: supabase stop
